# Gemma 4 31B release profile for Amazon Bedrock Mantle.
#
# Required environment:
#   AWS_PROFILE     AWS profile name forwarded to LiteLLM
#   AWS_REGION      Region that issued the key
#   OPENAI_API_KEY  Short-term Bedrock API key
#
# The endpoint below is in us-east-1, so AWS_REGION must also be us-east-1.

config_version: 2

rules:
  - examples/gemma4/prompt_injection.rule

models:
  gemma4:
    model: openai/google.gemma-4-31b
    endpoint: https://bedrock-mantle.us-east-1.api.aws/openai/v1
    aws_profile: ${AWS_PROFILE}
    region: ${AWS_REGION}
    score:
      message_builder: constitution
      boundary_seed: 482913
      tokens:
        negative: "0"
        positive: "1"
      extraction:
        probabilities: null
