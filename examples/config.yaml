# Credential-free CLI examples. The four semantic rules use deterministic
# keyword stubs through the explicit opt-in below. Do not use them for
# production decisions.
# The full example collection is exercised by scripts/e2e_signature_test.py.
config_version: 2
allow_stub_probers: true
rules:
  - examples/rules/addition.rule
  - examples/rules/all_comprehension.rule
  - examples/rules/call_sequence.rule
  - examples/rules/capability_tags.rule
  - examples/rules/contains.rule
  - examples/rules/filter_comprehension.rule
  - examples/rules/messages.rule
  - examples/rules/off_topic.rule
  - examples/rules/pattern_match.rule
  - examples/rules/tool_calls.rule
  - examples/rules/tool_name_comprehension.rule
  - examples/rules/topic_drift.rule
  - examples/rules/unrequested_action.rule
  - examples/rules/variables.rule

# Safety limits for local example scans.
rule_timeout: 5.0
max_messages: 10_000
max_message_size: 10_000_000
max_tool_calls: 1_000
max_total_size: 50_000_000
max_timeline_items: 10_000
