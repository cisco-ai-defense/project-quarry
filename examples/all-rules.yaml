# Rule selection for the complete example gate in scripts/e2e_signature_test.py.
# These rules require model aliases, a `policy` text resource, and prober backends.
# The gate supplies deterministic model and prober implementations in process.
# A standalone CLI scan needs an application-specific model backend and config.
config_version: 2
rules:
  - examples/rules/

rule_timeout: 5.0
max_messages: 10_000
max_message_size: 10_000_000
max_tool_calls: 1_000
max_total_size: 50_000_000
max_timeline_items: 10_000
