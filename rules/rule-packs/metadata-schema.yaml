$schema: https://json-schema.org/draft/2020-12/schema
title: Quarry detection rule metadata
type: object
required:
  - description
  - author
  - version
  - status
  - requires_quarry
properties:
  description:
    type: string
    minLength: 1
  author:
    type: string
    minLength: 1
  version:
    type: string
    pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
  status:
    type: string
    enum:
      - experimental
      - stable
      - deprecated
  requires_quarry:
    type: string
    pattern: '^>=[^,\s]+(,<[^,\s]+)?$'
  title:
    type: string
  threat_type:
    type: string
  signal_channel:
    type: string
  deprecation_reason:
    type: string
    minLength: 1
additionalProperties:
  type: string
