$schema: https://json-schema.org/draft/2020-12/schema
title: Quarry detection rule metadata
type: object
required:
  - description
  - author
  - revision
  - requires_quarry
properties:
  description:
    type: string
    minLength: 1
  author:
    type: string
    minLength: 1
  revision:
    type: string
    minLength: 1
  requires_quarry:
    type: string
    pattern: '^>=[^,\s]+(,<[^,\s]+)?$'
  title:
    type: string
  severity:
    type: string
    minLength: 1
  threat_type:
    type: string
  signal_channel:
    type: string
additionalProperties:
  type: string
