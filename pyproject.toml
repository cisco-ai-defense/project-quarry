[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "cisco-project-quarry"
version = "0.1.0"
description = "Detection DSL for AI agents"
readme = "README.md"
requires-python = ">=3.11,<3.14"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "cachetools==7.2.0",
    "google-re2==1.1.20251105",
    "lark==1.3.1",
    "loguru==0.7.3",
    "orjson>=3.11.6,<4",
    "packaging==26.3",
    "pydantic==2.13.5",
    "pygments>=2.21.0",
    "pyyaml>=6.0,<7",
    "rich==15.0.0",
]

[project.scripts]
quarry = "quarry.cli:main"
quarry-mcp = "quarry.plugin.server:main"

[project.optional-dependencies]
inference = [
    "aiohttp>=3.14.4",
    "boto3==1.43.118",
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "litellm==1.103.2",
    "anyio>=4.14.2",
    "certifi>=2026.10.19",
    "filelock>=4.2.1",
    "idna>=3.15",
    "multidict>=6.9.1",
    "python-dotenv>=1.2.2",
    "requests>=2.33.0",
    "urllib3>=2.8.0",
]
plugin = [
    "mcp==2.3.0",
    "pyjwt>=2.15.0",
    "cisco-project-quarry[inference]",
]

[dependency-groups]
dev = [
    "build==1.6.1",
    "coverage==7.17.0",
    "hypothesis==6.168.3",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-xdist==3.8.0",
    "ruff==0.17.2",
    "twine==6.2.0",
    "ty==0.0.84",
    "tiktoken==0.14.0",
]

[tool.hatch.build.targets.wheel]
packages = ["quarry"]

[tool.hatch.build.targets.wheel.force-include]
"quarry/py.typed" = "quarry/py.typed"

[tool.hatch.build.targets.sdist]
include = [
    "/quarry",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/README.md",
    "/SECURITY.md",
    "/SUPPORT.md",
    "/docs",
    "/examples",
    "/hooks",
    "/skills",
    "/.agents/plugins",
    "/.claude-plugin",
    "/.codex-plugin",
    "/.mcp.json",
    "/mcp.json",
    "/plugin.json",
    "/pyproject.toml",
    "/scripts",
]

[tool.hatch.build]
exclude = [
    "/.github",
    "/.git",
    "/.venv",
    "/build",
    "/dist",
    "/tests",
    "**/__pycache__",
    "**/*.pyc",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = [
    "E501",  # Line length is handled by the formatter.
    "B008",  # Function calls in argument defaults are valid for dependency injection.
    "N812",  # Short uppercase module aliases make automaton formulas easier to read.
    "N814",  # The compiler uses short type aliases in formulas.
    "N818",  # Compiler exception names are part of the public error contract.
]
