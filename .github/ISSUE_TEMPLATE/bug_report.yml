name: Bug report
description: Report a reproducible problem without sensitive data
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private endpoints, real conversations, or other sensitive data.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use synthetic input and a minimal rule.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: package version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Python version and operating system
    validations:
      required: true
