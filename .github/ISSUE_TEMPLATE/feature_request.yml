name: Feature request
description: Propose a change to the language or API
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the use case without private rules or conversation data.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include compatibility, safety-limit, and failure-mode considerations.
    validations:
      required: true
