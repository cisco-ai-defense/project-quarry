name: Trusted rule pack validation

on:
  pull_request:
    branches: [main]
    # Organization required workflows ignore event filters.
    paths: ["rules/rule-packs/**"]

permissions:
  contents: read

jobs:
  validate-rule-packs:
    name: Validate proposed rule packs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Require this workflow from refs/heads/main in the organization ruleset.
      - name: Check out trusted base code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install uv==0.13.8
      - name: Install trusted dependencies
        run: uv sync --frozen --no-default-groups
      - name: Read and validate proposed pack data
        shell: bash
        env:
          PROPOSED_COMMIT: ${{ github.sha }}
        run: |
          [[ "$PROPOSED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags --depth=1 origin "$PROPOSED_COMMIT"
          uv run --offline --no-sync python -I rules/validate.py --proposed-commit "$PROPOSED_COMMIT"
