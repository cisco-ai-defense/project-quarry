name: Package

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build tools
        run: python -m pip install build==1.3.0 twine==7.0.0 uv==0.8.22
      - name: Verify reviewed lock is current
        run: uv lock --check
      - name: Build artifacts
        run: python -m build
      - name: Validate metadata
        run: python -m twine check dist/*
      - name: Smoke-test wheel outside the checkout
        shell: bash
        run: |
          smoke_dir="$(mktemp -d)"
          wheel_path="$(pwd)/$(printf '%s\n' dist/*.whl)"
          cp -R examples "$smoke_dir/examples"
          python -m venv "$smoke_dir/venv"
          "$smoke_dir/venv/bin/python" -m pip install "$wheel_path"
          cd "$smoke_dir"
          "$smoke_dir/venv/bin/python" -m pip check
          "$smoke_dir/venv/bin/python" -c "import quarry; print(quarry.__version__)"
          "$smoke_dir/venv/bin/quarry" --help
          "$smoke_dir/venv/bin/quarry" scan -c examples/smoke.yaml -t examples/data/benign.json
      - name: Smoke-test inference extra outside the checkout
        shell: bash
        run: |
          smoke_dir="$(mktemp -d)"
          wheel_path="$(pwd)/$(printf '%s\n' dist/*.whl)"
          cp -R examples "$smoke_dir/examples"
          python -m venv "$smoke_dir/venv"
          "$smoke_dir/venv/bin/python" -m pip install "${wheel_path}[inference]"
          cd "$smoke_dir"
          "$smoke_dir/venv/bin/python" -m pip check
          "$smoke_dir/venv/bin/python" -c "from quarry import ModelInferenceBackend"
          "$smoke_dir/venv/bin/python" examples/model-inference/run.py
          "$smoke_dir/venv/bin/python" examples/parameters/run.py
      - name: Smoke-test agent plugin extra outside the checkout
        shell: bash
        run: |
          smoke_dir="$(mktemp -d)"
          wheel_path="$(pwd)/$(printf '%s\n' dist/*.whl)"
          python -m venv "$smoke_dir/venv"
          "$smoke_dir/venv/bin/python" -m pip install "${wheel_path}[plugin]"
          cd "$smoke_dir"
          "$smoke_dir/venv/bin/python" -m pip check
          "$smoke_dir/venv/bin/python" -c "from importlib.metadata import entry_points; from quarry.plugin.server import quarry_reference; assert any(entry.name == 'quarry-mcp' for entry in entry_points(group='console_scripts'))"
      - name: Smoke-test source distribution outside the checkout
        shell: bash
        run: |
          smoke_dir="$(mktemp -d)"
          sdist_path="$(pwd)/$(printf '%s\n' dist/*.tar.gz)"
          python -m venv "$smoke_dir/venv"
          "$smoke_dir/venv/bin/python" -m pip install "$sdist_path"
          cd "$smoke_dir"
          "$smoke_dir/venv/bin/python" -m pip check
          "$smoke_dir/venv/bin/python" -c "import quarry; print(quarry.__version__)"
