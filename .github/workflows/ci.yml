name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install uv==0.8.22
      - name: Verify reviewed lock is current
        run: uv lock --check
      - name: Sync reviewed dependencies
        run: uv sync --frozen --group dev --extra inference --extra plugin
      - name: Lint
        run: uv run --frozen --extra inference --extra plugin ruff check .
      - name: Check formatting
        run: uv run --frozen --extra inference --extra plugin ruff format --check .
      - name: Type check
        run: uv run --frozen --extra inference --extra plugin ty check quarry
      - name: Verify generated language artifacts
        run: uv run --frozen --extra inference --extra plugin python -m scripts.generate_language_spec --check

  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install uv==0.8.22
      - name: Sync reviewed dependencies
        run: uv sync --frozen --group dev --extra inference --extra plugin
      - name: Run tests
        run: uv run --frozen --extra inference --extra plugin pytest
      - name: Run deterministic examples
        run: uv run --frozen --extra inference --extra plugin python scripts/e2e_signature_test.py
